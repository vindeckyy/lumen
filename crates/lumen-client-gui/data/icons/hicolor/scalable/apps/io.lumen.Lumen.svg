<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#6e45d6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="0.45" stop-color="#ffd85c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd85c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Base: a rounded square with a soft shadow edge. -->
  <rect x="8" y="12" width="112" height="108" rx="24" fill="#1c3a7a" opacity="0.35"/>
  <rect x="8" y="8" width="112" height="108" rx="24" fill="url(#bg)"/>
  <!-- The screen. -->
  <rect x="24" y="30" width="80" height="52" rx="8" fill="#0f1b3d"/>
  <rect x="24" y="30" width="80" height="52" rx="8" fill="url(#glass)"/>
  <rect x="24" y="30" width="80" height="52" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- The stand. -->
  <path d="M54 82 h20 l3 12 h-26 z" fill="#ffffff"/>
  <rect x="44" y="92" width="40" height="5" rx="2.5" fill="#ffffff"/>
  <!-- The light the stream carries. -->
  <circle cx="64" cy="56" r="20" fill="url(#glow)"/>
  <path d="M64 44 l3.2 8.8 8.8 3.2 -8.8 3.2 -3.2 8.8 -3.2 -8.8 -8.8 -3.2 8.8 -3.2 z" fill="#ffffff"/>
</svg>
