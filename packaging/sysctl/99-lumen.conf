# Larger UDP socket buffers for high-resolution streaming.
#
# One high-resolution frame is a burst: a 4K keyframe is about a hundred packets sent at once, and
# a 5K IDR is several thousand. The Linux default (~208 KB) overflows on that burst, which drops
# packets and, under an infinite GOP, freezes the client decode on one frame. Lumen asks for
# 4 MB SO_SNDBUF/SO_RCVBUF; the kernel clamps to these caps, so raise them on the HOST.
#
# The setting follows punktfunk's scripts/99-punktfunk-net.conf (MIT OR Apache-2.0,
# Copyright (c) 2026 unom - Enrico Bühler).
#
# Install:  sudo cp packaging/sysctl/99-lumen.conf /etc/sysctl.d/ && sudo sysctl --system
net.core.wmem_max = 33554432
net.core.rmem_max = 33554432
