[package]
publish = false
name = "lumen-input-inject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-side input injection."

[dependencies]
lumen-input-wayland = { workspace = true }
reis = { workspace = true }
ashpd = { workspace = true, features = ["remote_desktop", "screencast"] }
tokio = { version = "1", features = ["rt"] }
evdev = "0.13"
x11rb = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true }
wayland-protocols-misc = { workspace = true }
# Local, not workspace: the workspace entry also enables `x11`, which links libxkbcommon-x11.so.
xkbcommon = { version = "0.9", default-features = false, features = ["wayland"] }
rustix = { workspace = true }
lumen-protocol = { workspace = true }
lumen-crypto = { workspace = true }

[lints]
workspace = true
