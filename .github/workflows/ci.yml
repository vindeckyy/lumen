name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches the channel pinned in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: fmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgbm-dev \
            libpipewire-0.3-dev \
            libopus-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgbm-dev \
            libpipewire-0.3-dev \
            libopus-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      # Tests that need a display or a DRM node skip themselves with a
      # printed reason when the environment is absent, so a headless
      # runner is expected to pass.
      - name: Test
        run: cargo test --workspace

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The cargo tooling is built with the runner's stable; the commands
      # below still run against the workspace's own pinned toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: deny
      # System libraries the workspace links against. Everything else
      # (libva, libei) is dlopen'ed at runtime and needs no build package.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgbm-dev \
            libpipewire-0.3-dev \
            libopus-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --locked
      # Licence policy: permissive licences only, copyleft rejected.
      # See deny.toml.
      - name: Check dependency policy
        run: cargo deny check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: audit
      # System libraries the workspace links against. Everything else
      # (libva, libei) is dlopen'ed at runtime and needs no build package.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgbm-dev \
            libpipewire-0.3-dev \
            libopus-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked
      - name: Check for known vulnerabilities
        run: cargo audit
